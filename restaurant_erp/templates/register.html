<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Restaurant ERP</title>
    <!-- Google Fonts for Modern Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .register-card {
            background: #ffffff;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
            font-weight: 600;
        }
        form p {
            margin-bottom: 15px;
        }
        /* Django form fields styling */
        form p label {
            display: block;
            font-weight: 500;
            color: #444;
            margin-bottom: 5px;
            font-size: 14px;
        }
        form p input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }
        form p input:focus {
            border-color: #667eea;
        }
        form ul.errorlist {
            color: #ff4d4d;
            font-size: 12px;
            list-style: none;
            margin-bottom: 10px;
        }
        .custom-role-group {
            margin-bottom: 20px;
        }
        .custom-role-group label {
            display: block;
            font-weight: 500;
            color: #444;
            margin-bottom: 5px;
            font-size: 14px;
        }
        .custom-role-group select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            background-color: #fff;
            outline: none;
            cursor: pointer;
        }
        .custom-role-group select:focus {
            border-color: #667eea;
        }
        button[type="submit"] {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: opacity 0.3s;
        }
        button[type="submit"]:hover {
            opacity: 0.9;
        }
        .login-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #666;
        }
        .login-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
        }
        .login-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="register-card">
    <h2>Create Account</h2>
    <form method="POST">
        {% csrf_token %}
        
        <!-- Django default form fields -->
        {{ form.as_p }}
        
        <!-- Role Selection Dropdown -->
        <div class="custom-role-group">
            <label for="role">Select Role:</label>
            <select name="role" id="role" required>
                <option value="" disabled selected>-- Choose your role --</option>
                <option value="Owner">Owner</option>
                <option value="Manager">Manager</option>
                <option value="Chef">Chef</option>
                <option value="Waiter">Waiter</option>
            </select>
        </div>

        <button type="submit">Register</button>
    </form>
    
    <div class="login-link">
        Already have an account? <a href="{% url 'login' %}">Login here</a>
    </div>
</div>

</body>
</html>
